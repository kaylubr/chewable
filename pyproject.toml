[project]
name = "chewable"
version = "0.1.0"
description = "Chewables photobooth backend API"
readme = "README.md"
authors = [
    { name = "kaylubr" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.20",
]


[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[project.scripts]
chewable = "core:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
