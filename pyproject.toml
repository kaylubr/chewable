[project]
name = "chewable"
version = "0.1.0"
description = "Chewables photobooth backend API"
readme = "README.md"
authors = [
    { name = "kaylubr" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.20",
    "pyjwt>=2.10",
    "boto3>=1.35",
    "alembic>=1.14",
]


[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "aioboto3>=13.1",
    "pytest-mock>=3.14",
    "asgi-lifespan>=2.1",
]

[project.scripts]
chewable = "core:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

